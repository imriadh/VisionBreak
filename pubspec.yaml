name: vision_break
description: A lightweight wellness app combining eye care timer, sleep cycle alarm, and Pomodoro productivity tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Notifications & Alarms
  flutter_local_notifications: ^16.3.0
  android_alarm_manager_plus: ^3.0.4
  flutter_foreground_task: ^6.1.2
  
  # UI & Animations
  cupertino_icons: ^1.0.6
  intl: ^0.18.1
  
  # Charts
  fl_chart: ^0.65.0
  
  # Utils
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
    - assets/images/

